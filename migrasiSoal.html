        btnMigrasi.addEventListener('click', async () => {
            btnMigrasi.disabled = true;
            btnMigrasi.innerText = "Sedang Memproses...";
            log("Memulai proses migrasi...");

            const daftarFile = [
                { data: dataKuis1, targetNode: 'Kuis1', namaKategori: 'Kuis 1' },
                { data: dataKuis2, targetNode: 'Kuis2', namaKategori: 'Kuis 2' },
                { data: dataEvaluasi, targetNode: 'Evaluasi', namaKategori: 'Evaluasi Akhir' }
            ];

            for (const file of daftarFile) {
                log(`-------------------------------`);
                log(`Memproses data internal untuk ${file.namaKategori}...`);
                
                try {
                    const dataJson = file.data;
                    log(`Berhasil membaca ${dataJson.length} soal. Bersiap mengunggah ke Node BankSoal/${file.targetNode}...`);
                    
                    let berhasil = 0;
                    for (const item of dataJson) {
                        const key = Object.keys(item)[0];
                        const soalData = item[key];

                        const dataBersih = {
                            pertanyaan: soalData.soal,
                            pilihanA: soalData.a,
                            pilihanB: soalData.b,
                            pilihanC: soalData.c,
                            pilihanD: soalData.d,
                            jawabanBenar: soalData.benar.toUpperCase()
                        };

                        await push(ref(db, `BankSoal/${file.targetNode}`), dataBersih);
                        berhasil++;
                    }
                    log(`[OK] Selesai mengunggah ${berhasil} soal untuk kategori ${file.namaKategori}.`);

                } catch (error) {
                    log(`<span style="color: #ef4444;">[GAGAL] Gagal memproses ${file.namaKategori}: ${error.message}</span>`);
                }
            }

            log(`-------------------------------`);
            log(`MANTAP! Seluruh proses migrasi soal telah selesai!`);
            log(`Anda sekarang dapat membuka halaman manajemenSoal.html untuk mengecek hasilnya.`);
            btnMigrasi.innerText = "Migrasi Selesai";
